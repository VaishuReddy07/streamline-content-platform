services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamline
      POSTGRES_USER: streamline
      POSTGRES_PASSWORD: streamline-local
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamline -d streamline"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: eu-west-3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://streamline:streamline-local@postgres:5432/streamline
      AWS_REGION: eu-west-3
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_NAME: partner-exports
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://streamline:streamline-local@postgres:5432/streamline
      AWS_REGION: eu-west-3
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_NAME: partner-exports
      PARTNER_EXPORT_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
        VITE_PARTNER_EXPORT_MODE: mock
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  postgres-data:
