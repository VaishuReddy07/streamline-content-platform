apiVersion: v1
kind: Namespace
metadata:
  name: streamline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamline-config
  namespace: streamline
data:
  PORT: "4000"
  AWS_REGION: "eu-west-3"
  SQS_QUEUE_NAME: "streamline-partner-exports"
  WEB_ORIGIN: "https://content.example.com"
  # Live mode prevents a deployed worker from reporting mock deliveries.
  PARTNER_EXPORT_MODE: "live"
  RUN_SCHEMA_SETUP: "false"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamline-api
  namespace: streamline
  annotations:
    # Replace with the IAM role ARN configured for EKS IRSA before deployment.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/streamline-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamline-worker
  namespace: streamline
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/streamline-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamline-api
  namespace: streamline
spec:
  replicas: 2
  selector:
    matchLabels: { app: streamline-api }
  template:
    metadata:
      labels: { app: streamline-api }
    spec:
      serviceAccountName: streamline-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/REPLACE_ME/streamline-api:0.1.0
          ports:
            - { name: http, containerPort: 4000 }
          envFrom:
            - configMapRef: { name: streamline-config }
            - secretRef: { name: streamline-runtime }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: streamline-api
  namespace: streamline
spec:
  selector: { app: streamline-api }
  ports:
    - { name: http, port: 4000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamline-worker
  namespace: streamline
spec:
  replicas: 1
  selector:
    matchLabels: { app: streamline-worker }
  template:
    metadata:
      labels: { app: streamline-worker }
    spec:
      serviceAccountName: streamline-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/REPLACE_ME/streamline-api:0.1.0
          command: ["node", "dist/worker.js"]
          envFrom:
            - configMapRef: { name: streamline-config }
            - secretRef: { name: streamline-runtime }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamline-web
  namespace: streamline
spec:
  replicas: 2
  selector:
    matchLabels: { app: streamline-web }
  template:
    metadata:
      labels: { app: streamline-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/REPLACE_ME/streamline-web:0.1.0
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: streamline-web
  namespace: streamline
spec:
  selector: { app: streamline-web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamline
  namespace: streamline
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: content.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: streamline-api, port: { number: 4000 } }
          - path: /healthz
            pathType: Exact
            backend:
              service: { name: streamline-api, port: { number: 4000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: streamline-web, port: { number: 80 } }
